<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUXE STORE PK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f7f3e8;
      color: #111111;
      font-family: Georgia, "Times New Roman", serif;
    }

    /* ---------- HEADER ---------- */

    header {
      background: #000000;
      border-bottom: 2px solid #d4af37;
      padding: 18px 12px 14px 12px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: #ffffff;
      font-size: 32px;
      letter-spacing: 6px;
      font-weight: bold;
    }

    header h1 span {
      color: #d4af37;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }

    .badge {
      background: #000000;
      color: #d4af37;
      border: 1px solid #d4af37;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ---------- OFFER BANNERS ---------- */

    .banner {
      padding: 14px 12px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.4;
      font-family: Arial, Helvetica, sans-serif;
    }

    .banner-black {
      background: #000000;
      color: #d4af37;
    }

    .banner-gold {
      background: linear-gradient(90deg, #b8902b, #f1d675, #b8902b);
      color: #000000;
    }

    /* ---------- PRODUCTS ---------- */

    .products-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 18px 10px 90px 10px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid #d4af37;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 26px rgba(212, 175, 55, 0.35);
    }

    .section-title {
      margin: 6px 0 16px 0;
      text-align: center;
      font-size: 20px;
      letter-spacing: 3px;
      color: #000000;
    }

    .section-title::after {
      content: "";
      display: block;
      width: 60px;
      height: 2px;
      margin: 8px auto 0 auto;
      background: #d4af37;
    }

    .tagline {
      margin: 6px 0 0 0;
      color: #d4af37;
      font-size: 12px;
      letter-spacing: 3px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .product-image {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1.1;
      object-fit: cover;
      background: #ffffff;
    }

    .img-contain {
      object-fit: contain;
      padding: 12px;
    }

    .img-top {
      object-position: top;
    }

    .product-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-name {
      margin: 0 0 4px 0;
      font-size: 16px;
      color: #000000;
    }

    .product-price {
      margin: 0 0 10px 0;
      font-size: 15px;
      font-weight: bold;
      color: #9a7b1c;
      font-family: Arial, Helvetica, sans-serif;
    }

    .order-btn {
      display: block;
      margin-top: auto;
      background: #000000;
      color: #d4af37;
      border: 1px solid #d4af37;
      border-radius: 6px;
      padding: 10px 6px;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      font-family: Arial, Helvetica, sans-serif;
    }

    .order-btn:hover {
      background: #d4af37;
      color: #000000;
    }

    .order-btn:focus-visible {
      outline: 3px solid #d4af37;
      outline-offset: 2px;
    }

    /* ---------- FOOTER ---------- */

    footer {
      background: #000000;
      color: #d4af37;
      border-top: 2px solid #d4af37;
      padding: 20px 12px;
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
      font-family: Arial, Helvetica, sans-serif;
    }

    footer strong {
      letter-spacing: 3px;
    }

    /* ---------- CHAT BOT ---------- */

    #chat-toggle {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #000000;
      color: #d4af37;
      border: 2px solid #d4af37;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      z-index: 1000;
      padding: 0;
    }

    #chat-toggle:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 2px;
    }

    #chat-box {
      position: fixed;
      right: 16px;
      bottom: 86px;
      width: 310px;
      max-width: calc(100vw - 32px);
      height: 240px;
      background: #ffffff;
      border: 2px solid #d4af37;
      border-radius: 10px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 1000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #chat-box.open {
      display: flex;
    }

    .chat-header {
      background: #000000;
      color: #d4af37;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 2px;
      flex-shrink: 0;
    }

    #chat-close {
      background: transparent;
      color: #d4af37;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }

    .chat-body {
      flex-grow: 1;
      overflow-y: auto;
      padding: 8px;
      background: #f2f2f2;
    }

    .msg {
      max-width: 82%;
      margin: 0 0 6px 0;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.35;
      word-wrap: break-word;
    }

    .msg-bot {
      background: #ffffff;
      color: #000000;
      border: 1px solid #dddddd;
      margin-right: auto;
    }

    .msg-user {
      background: #000000;
      color: #ffffff;
      margin-left: auto;
    }

    .chat-input-row {
      display: flex;
      border-top: 1px solid #d4af37;
      flex-shrink: 0;
    }

    #chat-input {
      flex-grow: 1;
      border: none;
      padding: 10px;
      font-size: 13px;
      min-width: 0;
    }

    #chat-input:focus {
      outline: none;
    }

    #chat-send {
      background: #000000;
      color: #d4af37;
      border: none;
      padding: 0 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 380px) {
      header h1 {
        font-size: 24px;
      }

      .banner {
        font-size: 13px;
      }
    }
  </style>
</head>
